name: CI

# Pull requests (any base) and pushes to main. Branch protection requires
# ONE check, `ci-ok`, which fails unless every other job succeeded -- so
# adding, renaming or removing a job never touches repository settings.
on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR supersedes the run in progress. Runs on main are
# never cancelled, so every commit on main keeps a complete verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: lint (shell + cargo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: bash -n every shell script
        run: |
          set -e
          for f in scripts/*.sh scripts/host/*.sh tests/*.sh tests/smoke-consumer/*.sh; do
            echo "checking: $f"
            bash -n "$f"
          done

      - name: shellcheck scripts
        run: |
          # `-x` so shellcheck follows `source _lib_harness.sh`.
          # `--severity=error` so style/info/warning lints surface in
          # the log but only outright errors fail CI. The harness uses
          # several intentional patterns (unquoted SSH_OPTS for word
          # splitting, dynamic-path source, transient loop counters)
          # that trip warnings without being bugs.
          shellcheck -x --severity=error scripts/*.sh scripts/host/*.sh

      - name: shellcheck test scripts
        run: |
          shellcheck --severity=error tests/*.sh tests/smoke-consumer/*.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runner -> target

      - name: cargo fmt --check
        run: cargo fmt --manifest-path runner/Cargo.toml --all -- --check

      - name: cargo clippy
        run: cargo clippy --manifest-path runner/Cargo.toml --all-targets -- -D warnings

  runner-unit:
    name: runner unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runner -> target

      - name: cargo test
        run: cargo test --manifest-path runner/Cargo.toml --all-features --no-fail-fast

  state-machine:
    name: state-machine integration test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: run state-machine self-test
        run: bash tests/state-machine.sh

  config:
    name: config (schemas, examples, negative fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jsonschema
        # Python 3.12+ on ubuntu-latest is PEP 668 managed; --user keeps
        # the install out of the system site-packages.
        run: python3 -m pip install --user --upgrade jsonschema

      - name: validate every consumer config; reject every invalid fixture
        run: python3 tests/validate-configs.py

  smoke:
    name: smoke (windows-latest, WinFsp memfs, run-tests.sh over SSH)
    # The real thing, end to end: scripts/run-tests.sh on this Windows
    # runner orchestrates the smoke consumer against the same runner as
    # its "VM" over SSH to localhost. Every VM step mounts a volume
    # through WinFsp (memfs), so a green run means the harness really
    # booted a filesystem, drove file ops on the drive letter, unmounted,
    # and reported what happened -- including a canary it must report as
    # failed. See tests/smoke-consumer/run-smoke.sh.
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VM_WORKDIR: C:/fswth-vm/smoke-consumer
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runner -> target

      - name: install WinFsp (the filesystem under test is its memfs)
        shell: pwsh
        run: |
          choco install winfsp -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem "${env:ProgramFiles(x86)}\WinFsp\bin\memfs-*.exe" | Format-Table -AutoSize Name, Length

      - name: make this runner its own Windows VM (sshd, key auth, PowerShell)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Key generated with Git's ssh-keygen: pwsh would hand
          # `-N '""'` over as a literal two-character passphrase.
          & "$env:ProgramFiles\Git\bin\bash.exe" -c 'mkdir -p ~/.ssh && ssh-keygen -t ed25519 -N "" -f ~/.ssh/fswth-smoke -q'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # runneradmin is an administrator, and sshd_config sends
          # administrators to this file, which must be admin/SYSTEM-only.
          $keys = "$env:ProgramData\ssh\administrators_authorized_keys"
          Get-Content "$env:USERPROFILE\.ssh\fswth-smoke.pub" | Set-Content -Encoding ascii $keys
          icacls $keys /inheritance:r /grant 'Administrators:F' /grant 'SYSTEM:F' | Out-Null
          # The harness speaks PowerShell to the VM (ship phase, ops).
          New-ItemProperty -Path HKLM:\SOFTWARE\OpenSSH -Name DefaultShell `
            -Value "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" `
            -PropertyType String -Force | Out-Null
          Restart-Service sshd
          Get-Service sshd | Format-Table -AutoSize

      - name: build run-matrix
        run: cargo build --manifest-path runner/Cargo.toml --release --bin run-matrix

      - name: smoke test (run-tests.sh -> ssh localhost -> WinFsp memfs)
        run: |
          # No .test-env and no terminal: run-tests.sh bootstraps from the
          # flags, and its preflight trusts localhost's host key itself.
          bash tests/smoke-consumer/run-smoke.sh \
            --vm-host=runneradmin@localhost \
            --ssh-key="$(cygpath -m ~/.ssh/fswth-smoke)" \
            --vm-workdir="$VM_WORKDIR"

      - name: dump diagnostics on failure
        if: failure()
        run: |
          dump() {
            [ -d "$1" ] || { echo "(no $1)"; return; }
            find "$1" -type f | sort | while read -r f; do
              echo "----- $f -----"
              head -c 20000 "$f"; echo
            done
          }
          dump tests/smoke-consumer/test-diagnostics
          # On the "VM": memfs launcher sync logs beside the images, and
          # Invoke-WithMount's capture of the last mount's output.
          for f in "$(cygpath -u "$VM_WORKDIR")"/*.log ~/dev/ext4-work/last-mount-diag/*; do
            [ -f "$f" ] && { echo "----- $f -----"; cat "$f"; echo; }
          done

  ci-ok:
    # THE required check for branch protection / auto-merge. Fails if any
    # job failed, was cancelled or was skipped, and if a job exists that
    # this one does not wait for.
    name: ci-ok
    if: always()
    needs: [lint, runner-unit, state-machine, config, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: every other job is listed in needs
        run: |
          jobs=$(yq -r '.jobs | keys | .[] | select(. != "ci-ok")' .github/workflows/ci.yml | sort)
          needs=$(yq -r '.jobs["ci-ok"].needs[]' .github/workflows/ci.yml | sort)
          if [ "$jobs" != "$needs" ]; then
            echo "ci-ok.needs must list every job in ci.yml" >&2
            diff <(echo "$jobs") <(echo "$needs") >&2 || true
            exit 1
          fi

      - name: every needed job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'length > 0 and all(.[]; .result == "success")' > /dev/null
